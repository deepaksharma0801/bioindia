# Serves the static dashboard and proxies the API on the same origin, so the browser needs no CORS.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;  # keep the published port (8080) in redirects

    location = / {
        return 302 /BioIndia_v3_Complete.html;
    }

    # Only the dashboard files are mounted into this directory; nothing else is served.
    location / {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;  # some state reports take ~30 s
    }

    location = /docs { proxy_pass http://api:8000; }
    location = /openapi.json { proxy_pass http://api:8000; }
}
